<style>
:root{--bg:#04070b;--c:#16e0ff;--card:#09121a;--t:#e6fbff;--m:#7aa2ad;--r:#ff5470}
*{box-sizing:border-box;margin:0}
body{background:radial-gradient(ellipse at 50% -10%,#0b3040,var(--bg) 62%) fixed;color:var(--t);font-family:system-ui,Tahoma,Arial,sans-serif;min-height:100vh}
button,input,textarea{font:inherit}button{cursor:pointer}
header{display:flex;align-items:center;gap:10px;padding:8px 14px;position:sticky;top:0;z-index:5;background:#04070bdd;backdrop-filter:blur(10px);border-bottom:1px solid #16e0ff40}
header img{height:52px;filter:drop-shadow(0 0 8px #16e0ff88)}
.sp{flex:1}
.b{background:transparent;color:var(--c);border:1px solid var(--c);border-radius:8px;padding:8px 13px;position:relative}
.f{background:var(--c);color:#001018;font-weight:700;border-color:var(--c)}
.b:disabled{opacity:.4;cursor:not-allowed}
#cn{position:absolute;top:-8px;inset-inline-end:-8px;background:var(--r);color:#fff;border-radius:99px;font-size:12px;min-width:20px;height:20px;line-height:20px;text-align:center}
h1{text-align:center;padding:26px 14px 6px;font-size:1.5rem;letter-spacing:.5px}
.sub{text-align:center;color:var(--m);padding:0 14px 18px}
#g{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;padding:0 14px 40px;max-width:1100px;margin:auto}
.k{background:var(--card);border:1px solid #16e0ff38;border-radius:4px 22px 4px 22px;overflow:hidden;display:flex;flex-direction:column}
.im{position:relative;aspect-ratio:1;background:#000 center/cover;cursor:pointer}
.im img{width:100%;height:100%;object-fit:cover;display:block}
.tag{position:absolute;top:8px;inset-inline-start:8px;background:var(--r);color:#fff;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:700}
.oos{position:absolute;inset:0;background:#000a;display:grid;place-items:center;font-weight:700;color:var(--r);letter-spacing:1px}
.in{padding:10px;display:flex;flex-direction:column;gap:7px;flex:1}
.n{font-weight:600}.p{color:var(--c);font-weight:700}.p s{color:var(--m);font-weight:400;margin-inline-start:6px}
.st{font-size:12px;color:var(--m)}.st.lo{color:#ffb02e}
.cs{display:flex;gap:6px;flex-wrap:wrap}
.co{width:24px;height:24px;border-radius:50%;border:2px solid #fff3;padding:0}.co.on{border-color:var(--c);box-shadow:0 0 0 2px #000,0 0 0 4px var(--c)}
.k .b{margin-top:auto}
#ov{position:fixed;inset:0;background:#000a;display:none;z-index:8}
#dr{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(420px,100%);background:#070d14;border-inline-start:1px solid var(--c);z-index:9;transform:translateX(105%);transition:transform .25s;display:flex;flex-direction:column}
[dir=rtl] #dr{transform:translateX(-105%)}
body.o #dr{transform:none}body.o #ov{display:block}
#dr h2{padding:14px;border-bottom:1px solid #16e0ff30;display:flex;justify-content:space-between}
#ci{flex:1;overflow:auto;padding:10px 14px}
.ri{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #ffffff12}
.ri img{width:50px;height:50px;object-fit:cover;border-radius:6px}.ri div{flex:1;font-size:14px}
.q{display:flex;align-items:center;gap:6px}.q button{width:28px;height:28px;border-radius:6px;border:1px solid var(--c);background:0;color:var(--c)}
#ft{padding:14px;border-top:1px solid #16e0ff30;display:flex;flex-direction:column;gap:8px}
#ft input{background:#0c1822;border:1px solid #16e0ff40;color:var(--t);border-radius:8px;padding:10px}
.tot{display:flex;justify-content:space-between;font-weight:700;font-size:1.1rem}
footer{text-align:center;padding:24px;color:var(--m);border-top:1px solid #16e0ff22}footer a{color:var(--c)}
.em{text-align:center;color:var(--m);padding:40px;grid-column:1/-1}
#ts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--c);color:#001018;padding:8px 18px;border-radius:99px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}#ts.s{opacity:1}

en:{h:"Phone Accessories",s:"Order easily — your order arrives on WhatsApp",add:"Add to cart",oos:"Out of stock",left:n=>`Only ${n} left`,av:n=>`In stock: ${n}`,cart:"Cart",tot:"Total",buy:"Buy via WhatsApp",nm:"Name",ad:"Address",em:"Your cart is empty",none:"No products yet",lg:"عربي",need:"Enter your name and address",ord:"New order from WISAGO.TECH",cl:"Color",tt:"Total",added:"Added to cart"}};
let L=localStorage.lang||"ar",P={},C=JSON.parse(localStorage.cart||"[]"),S={},I={},ld=false;
const $=i=>document.getElementById(i),t=k=>T[L][k],esc=s=>String(s??"").replace(/[&<>"']/g,c=>"&#"+c.charCodeAt(0)+";");
const nmOf=p=>(L=="en"&&p.name_en)||p.name_ar||p.name_en||"",$$=n=>"$"+(+n).toFixed(2).replace(/\.00$/,"");
const pr=p=>p.sale>0&&p.sale<p.price?+p.sale:+p.price;

function draw(){const ids=Object.keys(P).sort((a,b)=>(P[b].ts||0)-(P[a].ts||0));

${cs.length?`<div class="cs">${cs.map((c,j)=>`<button class="co${j==s?" on":""}" title="${esc(c.n)}" style="background:${esc(c.c)}" data-c="${id}|${j}"></button>`).join("")}</div>`:""}
<div class="st${p.stock>0&&p.stock<=3?" lo":""}">${out?t("oos"):p.stock<=3?t("left")(p.stock):t("av")(p.stock)}</div>

$("tv").textContent=$$(tot);$("bu").disabled=!C.length||!ld}

else if(i){I[i.dataset.i]=(I[i.dataset.i]||0)+1;draw()}};
$("ci").onclick=e=>{const m=e.target.closest("[data-m]");if(!m)return;const[k,d]=m.dataset.m.split("|");C[k].q=Math.min(C[k].q+ +d,P[C[k].id].stock);cart()};

const ls=C.map(x=>{const p=P[x.id],c=(p.colors||[])[x.c],s=pr(p)*x.q;tot+=s;return `• ${nmOf(p)}${c?` (${c.n})`:""} ×${x.q} = ${$$(s)}`});

const u=`https://wa.me/${WA}?text=${encodeURIComponent(msg)}`;if(!window.open(u,"_blank"))location.href=u};
